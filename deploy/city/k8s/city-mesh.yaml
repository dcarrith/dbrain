apiVersion: v1
kind: Namespace
metadata:
  name: dbrain-city-mesh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbrain-city-config
  namespace: dbrain-city-mesh
data:
  DBRAIN_TOPOLOGY_PROFILE: "city"
  DBRAIN_NODE_NAME: "Municipal & Civic Mesh Brain"
  CHIA_NETWORK: "mainnet"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbrain-city-mesh
  namespace: dbrain-city-mesh
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dbrain-city-mesh
  template:
    metadata:
      labels:
        app: dbrain-city-mesh
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dbrain
          image: dbrain:1.10.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dbrain-city-config
          resources:
            requests:
              cpu: "250m"
              memory: "64Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/dbrain
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dbrain-city-mesh-hpa
  namespace: dbrain-city-mesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dbrain-city-mesh
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: dbrain-city-mesh
  namespace: dbrain-city-mesh
spec:
  selector:
    app: dbrain-city-mesh
  ports:
    - port: 80
      targetPort: 3000
